name: discord-quotes

services:
  web:
    build: .
    image: discord-quotes-web:latest
    pull_policy: never
    restart: unless-stopped
    # environment:
    #   - BASE_URL=/quotes
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.discord-quotes.rule=Host(`quotes.tangerie.xyz`)"
      - "traefik.http.routers.discord-quotes.entrypoints=websecure"
      - "traefik.http.routers.discord-quotes.priority=1000"
      - "traefik.http.services.discord-quotes.loadbalancer.server.port=8000"

networks:
  traefik-proxy:
    external: true
